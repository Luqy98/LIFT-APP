name: Build Android APK

# Run it by changing apk/build-request.txt (any edit pushed to main starts a build),
# or from the Actions tab with "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apk/build-request.txt']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read app version
        id: v
        run: echo "version=$(grep -oP "VERSION = '\K[^']+" version.js)" >> "$GITHUB_OUTPUT"

      - name: Stage the web files (no service worker; the app bundles everything)
        run: |
          mkdir -p apk/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='apk' --exclude='tests' \
            --exclude='README.md' --exclude='download.html' --exclude='_headers' --exclude='sw.js' ./ apk/www/
          ls apk/www | head -50

      - name: Install Capacitor and create the Android project
        working-directory: apk
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Harden the manifest (no internet permission, no cloud backup)
        working-directory: apk/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' "$M"
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          # vibration (rest bell) and fingerprint unlock
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          grep -n "permission\|allowBackup" "$M" || true

      - name: Edge-to-edge (draw behind the status and navigation bars)
        working-directory: apk/android
        run: |
          F=$(find app/src/main/java -name 'MainActivity.*' | head -1)
          echo "MainActivity: $F"; cat "$F"
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //; s/;//')
          case "$F" in
            *.java)
              cat > "$F" <<JAVA
          package $PKG;

          import android.os.Bundle;
          import androidx.activity.EdgeToEdge;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              EdgeToEdge.enable(this);
              super.onCreate(savedInstanceState);
              if (getSupportActionBar() != null) getSupportActionBar().hide();
            }
          }
          JAVA
              ;;
            *.kt)
              cat > "$F" <<KOTLIN
          package $PKG

          import android.os.Bundle
          import androidx.activity.EdgeToEdge
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              EdgeToEdge.enable(this)
              super.onCreate(savedInstanceState)
              supportActionBar?.hide()
            }
          }
          KOTLIN
              ;;
          esac
          cat "$F"

      - name: Rest timer notification (small native plugin, registered in MainActivity)
        working-directory: apk/android
        run: |
          F=$(find app/src/main/java -name 'MainActivity.*' | head -1)
          D=$(dirname "$F")
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //; s/;//')
          cat > "$D/LiftNotifyPlugin.java" <<JAVA
          package $PKG;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "LiftNotify", permissions = { @Permission(alias = "notify", strings = { Manifest.permission.POST_NOTIFICATIONS }) })
          public class LiftNotifyPlugin extends Plugin {
            private static final String CHANNEL = "lift_rest";
            private static final int NOTE_ID = 4711;

            private void ensureChannel(Context ctx) {
              if (Build.VERSION.SDK_INT < 26) return;
              NotificationManager nm = ctx.getSystemService(NotificationManager.class);
              nm.deleteNotificationChannel("lift_stopwatch");
              NotificationChannel ch = new NotificationChannel(CHANNEL, "Rest timer", NotificationManager.IMPORTANCE_LOW);
              ch.setShowBadge(false);
              nm.createNotificationChannel(ch);
            }

            @PluginMethod
            public void requestPerm(PluginCall call) {
              if (Build.VERSION.SDK_INT < 33 || getPermissionState("notify") == PermissionState.GRANTED) {
                JSObject r = new JSObject(); r.put("granted", true); call.resolve(r); return;
              }
              requestPermissionForAlias("notify", call, "permDone");
            }

            @PermissionCallback
            private void permDone(PluginCall call) {
              JSObject r = new JSObject(); r.put("granted", getPermissionState("notify") == PermissionState.GRANTED); call.resolve(r);
            }

            @PluginMethod
            public void show(PluginCall call) {
              Context ctx = getContext();
              ensureChannel(ctx);
              Double ends = call.getDouble("endsAt");
              long endsAt = ends != null ? ends.longValue() : System.currentTimeMillis();
              long left = Math.max(1000L, endsAt - System.currentTimeMillis());
              Intent open = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
              if (open != null) open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
              PendingIntent pi = open == null ? null : PendingIntent.getActivity(ctx, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              int icon = ctx.getResources().getIdentifier("ic_stat_lift", "drawable", ctx.getPackageName());
              NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CHANNEL)
                .setSmallIcon(icon != 0 ? icon : ctx.getApplicationInfo().icon)
                .setContentTitle(call.getString("title", "Rest timer"))
                .setContentText(call.getString("text", ""))
                .setOngoing(true)
                .setSilent(true)
                .setOnlyAlertOnce(true)
                .setCategory(NotificationCompat.CATEGORY_PROGRESS)
                .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                .setShowWhen(true)
                .setWhen(endsAt)
                .setUsesChronometer(true)
                .setChronometerCountDown(true)
                .setTimeoutAfter(left);
              if (pi != null) b.setContentIntent(pi);
              try { NotificationManagerCompat.from(ctx).notify(NOTE_ID, b.build()); } catch (SecurityException e) { /* permission refused */ }
              call.resolve();
            }

            @PluginMethod
            public void hide(PluginCall call) {
              NotificationManagerCompat.from(getContext()).cancel(NOTE_ID);
              call.resolve();
            }
          }
          JAVA
          case "$F" in
            *.java) sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(LiftNotifyPlugin.class);\n    super.onCreate(savedInstanceState);/' "$F" ;;
            *.kt) sed -i 's/super.onCreate(savedInstanceState)/registerPlugin(LiftNotifyPlugin::class.java)\n    super.onCreate(savedInstanceState)/' "$F" ;;
          esac
          grep -q "registerPlugin(LiftNotifyPlugin" "$F"
          cat "$F"
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_stat_lift.xml <<XML
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M1,10h2v4H1z M3.5,7.5h3v9h-3z M7,11h10v2H7z M17.5,7.5h3v9h-3z M21,10h2v4h-2z"/>
          </vector>
          XML

      - name: App icon
        working-directory: apk
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Plain window background (no stretched splash image behind the status bar)
        working-directory: apk/android
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/lift_colors.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="lift_window_bg">#0b0a10</color>
          </resources>
          XML
          S=app/src/main/res/values/styles.xml
          echo "--- template styles.xml ---"; cat "$S"
          # Own theme file: every theme is a NoActionBar theme, so Android never draws its own title bar over the app.
          cat > "$S" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">@color/lift_window_bg</item>
                  <item name="android:background">@color/lift_window_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">@color/lift_window_bg</item>
              </style>
          </resources>
          XML
          cat "$S"
          grep -n "android:theme" app/src/main/AndroidManifest.xml || true

      - name: Set version numbers
        working-directory: apk/android
        run: |
          G=$(ls app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode = ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName = \"${{ steps.v.outputs.version }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"
          grep -q "versionCode = ${{ github.run_number }}" "$G"

      - name: Build release APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.LIFT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "Missing secret LIFT_KEYSTORE_B64"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lift.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls apk/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lift.jks" --ks-key-alias lift \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "LIFT-${{ steps.v.outputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "LIFT-${{ steps.v.outputs.version }}.apk" | head -4
          "$BT/aapt" dump permissions "LIFT-${{ steps.v.outputs.version }}.apk" || true
          sha256sum "LIFT-${{ steps.v.outputs.version }}.apk" | tee sha.txt
          rm -f "$RUNNER_TEMP/lift.jks"

      - name: Fixed-name copy for the download page
        run: cp "LIFT-${{ steps.v.outputs.version }}.apk" LIFT.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.v.outputs.version }}-b${{ github.run_number }}
          name: LIFT ${{ steps.v.outputs.version }} for Android
          body: |
            Download **LIFT-${{ steps.v.outputs.version }}.apk** below, open it on your phone and tap Install.
            Installing over an older version keeps your data.
          make_latest: true
          files: |
            LIFT-${{ steps.v.outputs.version }}.apk
            LIFT.apk
