name: Build Android APK

# Run it by changing apk/build-request.txt (any edit pushed to main starts a build),
# or from the Actions tab with "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apk/build-request.txt']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read app version
        id: v
        run: echo "version=$(grep -oP "VERSION = '\K[^']+" version.js)" >> "$GITHUB_OUTPUT"

      - name: Stage the web files (no service worker; the app bundles everything)
        run: |
          mkdir -p apk/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='apk' --exclude='tests' \
            --exclude='README.md' --exclude='_headers' --exclude='sw.js' ./ apk/www/
          ls apk/www | head -50

      - name: Install Capacitor and create the Android project
        working-directory: apk
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Harden the manifest (no internet permission, no cloud backup)
        working-directory: apk/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' "$M"
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          # vibration (rest bell) and fingerprint unlock
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' "$M"
          grep -n "permission\|allowBackup" "$M" || true

      - name: Edge-to-edge (draw behind the status and navigation bars)
        working-directory: apk/android
        run: |
          F=$(find app/src/main/java -name 'MainActivity.*' | head -1)
          echo "MainActivity: $F"; cat "$F"
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //; s/;//')
          case "$F" in
            *.java)
              cat > "$F" <<JAVA
          package $PKG;

          import android.os.Bundle;
          import androidx.activity.EdgeToEdge;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              EdgeToEdge.enable(this);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
              ;;
            *.kt)
              cat > "$F" <<KOTLIN
          package $PKG

          import android.os.Bundle
          import androidx.activity.EdgeToEdge
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              EdgeToEdge.enable(this)
              super.onCreate(savedInstanceState)
            }
          }
          KOTLIN
              ;;
          esac
          cat "$F"

      - name: App icon
        working-directory: apk
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Set version numbers
        working-directory: apk/android
        run: |
          G=$(ls app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode = ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName = \"${{ steps.v.outputs.version }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"
          grep -q "versionCode = ${{ github.run_number }}" "$G"

      - name: Build release APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.LIFT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "Missing secret LIFT_KEYSTORE_B64"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lift.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls apk/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lift.jks" --ks-key-alias lift \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "LIFT-${{ steps.v.outputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "LIFT-${{ steps.v.outputs.version }}.apk" | head -4
          "$BT/aapt" dump permissions "LIFT-${{ steps.v.outputs.version }}.apk" || true
          sha256sum "LIFT-${{ steps.v.outputs.version }}.apk" | tee sha.txt
          rm -f "$RUNNER_TEMP/lift.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.v.outputs.version }}-b${{ github.run_number }}
          name: LIFT ${{ steps.v.outputs.version }} for Android
          body: |
            Download **LIFT-${{ steps.v.outputs.version }}.apk** below, open it on your phone and tap Install.
            Installing over an older version keeps your data.
          files: LIFT-${{ steps.v.outputs.version }}.apk
